# ML baseline settings (docs/ml-baseline-spec.md). The ML model never feeds a decision.

[features]
# Mapped facts. Names are the fact names in rules/fields.toml.
numeric = [
  "employment_months",
  "monthly_net_income",
  "monthly_obligations",
  "credit_score",
  "enquiries_6m",
  "requested_amount",
  "requested_tenure_months",
]
categorical = ["employment_type", "obligations_source"]
# True / false / unknown. Encoded as three categories.
tri_state = ["severe_delinquency_36m", "written_off"]
# Ratios computed from the numeric facts above (ml code only; no engine or calculation module is imported).
derived = ["existing_foir", "amount_to_annual_income", "instalment_to_income"]
# Missing-value indicators are added by the imputer for every numeric feature and every derived ratio.

[features.excluded]
# A feature in this list, or any column named in docs/decision-tables.md section 6 (protected attributes),
# or any identifier, or any column derived from a label, must never appear in the feature list.
facts = ["age", "kyc_verified", "consent_given", "region_tier", "applicant_id"]
raw_columns = [
  "SK_ID_CURR", "TARGET",
  "CODE_GENDER", "NAME_EDUCATION_TYPE", "NAME_FAMILY_STATUS", "REGION_RATING_CLIENT",
  "EXT_SOURCE_1", "EXT_SOURCE_2", "EXT_SOURCE_3",
]
label_columns = ["TARGET", "policy_decision", "policy_eligible", "sim_default"]
# Reasons are in docs/ml-baseline-spec.md section 3.

[proxy_review]
# Features or source columns that can stand in for a protected attribute. Reviewed and listed in the model card.
in_features = ["employment_type", "monthly_net_income"]
excluded_by_design = ["REGION_RATING_CLIENT", "NAME_EDUCATION_TYPE", "NAME_FAMILY_STATUS", "OCCUPATION_TYPE"]

[preprocessing]
numeric_impute = "median"
scale_numeric_for = ["lr"]
one_hot_drop = "none"
imbalance = "class_weight_balanced"

[lr]
model = "LogisticRegression"
C = 1.0
penalty = "l2"
solver = "lbfgs"
max_iter = 1000
class_weight = "balanced"

[gb]
model = "HistGradientBoostingClassifier"
max_iter = 200
learning_rate = 0.1
max_leaf_nodes = 31
min_samples_leaf = 20
l2_regularization = 0.0
early_stopping = false
class_weight = "balanced"
# If the installed scikit-learn has no class_weight argument here, pass sample_weight with the same balanced weights.

[tuning]
# Fixed hyperparameters. No search. The test split is never used to tune or to choose a model.
enabled = false
