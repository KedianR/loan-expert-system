layer = "validation"

[[rule]]
id = "V01"
layer = "validation"
description = "Any required fact is missing"
clause = "CP-7.1"
when = "any_required_unknown"
outcome = "refer"
reason_code = "INCOMPLETE_APPLICATION"
owner = "credit-policy"
effective_date = "2026-11-05"
version = "0.1.0"
status = "active"

[[rule]]
id = "V02"
layer = "validation"
description = "Consent is not recorded"
clause = "CP-7.2"
when = "not consent_given"
outcome = "ineligible"
reason_code = "CONSENT_NOT_GIVEN"
owner = "credit-policy"
effective_date = "2026-11-05"
version = "0.1.0"
status = "active"

[[rule]]
id = "V03"
layer = "validation"
description = "Requested amount is outside 50,000 to 25,00,000"
clause = "CP-1.1"
when = "requested_amount < min_amount or requested_amount > max_amount"
outcome = "ineligible"
reason_code = "AMOUNT_OUTSIDE_PRODUCT_LIMITS"
owner = "credit-policy"
effective_date = "2026-11-05"
version = "0.1.0"
status = "active"

[[rule]]
id = "V04"
layer = "validation"
description = "Requested tenure is outside 12 to 60 months"
clause = "CP-1.3"
when = "requested_tenure_months < min_tenure_months or requested_tenure_months > max_tenure_months"
outcome = "ineligible"
reason_code = "TENURE_OUTSIDE_PRODUCT_LIMITS"
owner = "credit-policy"
effective_date = "2026-11-05"
version = "0.1.0"
status = "active"

