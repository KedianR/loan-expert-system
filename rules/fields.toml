# rules/fields.toml
# Field registry for the loan expert system.
# Spec: docs/09-file-formats.md §3

[[field]]
name = "applicant_id"
kind = "input"
type = "string"
required = true
nullable = false
predicate = "applicant_id"
readable_from = "never"

[[field]]
name = "age"
kind = "input"
type = "int"
unit = "years"
min = 0
max = 120
required = true
nullable = false
predicate = "age"
readable_from = "validation"

