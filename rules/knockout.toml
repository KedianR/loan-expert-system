layer = "knockout"

[[rule]]
id = "K01"
layer = "knockout"
description = "Age is under 18"
clause = "CP-2.1"
when = "age < min_age"
outcome = "ineligible"
reason_code = "LEGAL_CAPACITY_NOT_MET"
owner = "credit-policy"
effective_date = "2026-11-05"
version = "0.1.0"
status = "active"

[[rule]]
id = "K02"
layer = "knockout"
description = "KYC is not verified"
clause = "CP-2.6"
when = "not kyc_verified"
outcome = "ineligible"
reason_code = "KYC_NOT_VERIFIED"
owner = "credit-policy"
effective_date = "2026-11-05"
version = "0.1.0"
status = "active"

[[rule]]
id = "K03"
layer = "knockout"
description = "Any 90+ days past due in 36 months, or a written-off account"
clause = "CP-2.5"
when = "severe_delinquency_36m or written_off"
outcome = "ineligible"
reason_code = "ADVERSE_REPAYMENT_HISTORY"
owner = "credit-policy"
effective_date = "2026-11-05"
version = "0.1.0"
status = "active"

[[rule]]
id = "K04"
layer = "knockout"
description = "Credit score is known and below the minimum"
clause = "CP-2.3"
when = "credit_score < min_credit_score"
outcome = "ineligible"
reason_code = "CREDIT_SCORE_BELOW_MINIMUM"
owner = "credit-policy"
effective_date = "2026-11-05"
version = "0.1.0"
status = "active"

[[rule]]
id = "K05"
layer = "knockout"
description = "Monthly net income is below 15,000"
clause = "CP-2.2"
when = "monthly_net_income < min_monthly_income"
outcome = "ineligible"
reason_code = "INCOME_BELOW_MINIMUM"
owner = "credit-policy"
effective_date = "2026-11-05"
version = "0.1.0"
status = "active"

[[rule]]
id = "K06"
layer = "knockout"
description = "Salaried with under 6 months, or self-employed with under 24 months, in current employment"
clause = "CP-2.4"
when = "(employment_type == salaried and employment_months < min_employment_months_salaried) or (employment_type == self_employed and employment_months < min_employment_months_self_employed)"
outcome = "ineligible"
reason_code = "EMPLOYMENT_TENURE_TOO_SHORT"
owner = "credit-policy"
effective_date = "2026-11-05"
version = "0.1.0"
status = "active"

